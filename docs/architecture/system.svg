<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="872" viewBox="0 0 1176 872" role="img" aria-label="Public results pages are crawled once and resolved into runner histories that can only be read before a date; a hierarchical model and a boosted challenger are blended, conformalised by history depth and simulated as a field; from a week out each race&#x27;s predictions are frozen, tagged and hashed, then scored against the official results on a public site." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
