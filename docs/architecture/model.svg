<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="860" viewBox="0 0 1152 860" role="img" aria-label="Every finish is put on one scale; a hierarchical model gives each runner a fitness, a distance fade and a form that walks year to year, shrunk towards their age and sex group, and each race its measured course difficulty, calendar year and that morning&#x27;s heat and wind; a boosted challenger is blended in, the range is conformalised by history depth, and places come from drawing the whole field together." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
