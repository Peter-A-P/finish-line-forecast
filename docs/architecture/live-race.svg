<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="1084" viewBox="0 0 1172 1084" role="img" aria-label="From a week out a scheduled task on the laptop snapshots the entrant list each morning, predicts the new entrants, and the day before predicts the whole field with the latest forecast and its places; every file is committed, tagged and hashed before the gun and freeze refuses inside 24 hours of it; after the results post, score reads each prediction back from its tag and writes the record." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
