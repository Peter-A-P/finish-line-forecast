<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="How often the ranges held, by how much history a runner has" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="880" height="350" fill="#fdfdfb"/><text x="16" y="24" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">How often the ranges held, by how much history a runner has</text><text x="16" y="42" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">A range that holds less often than it promises is a range that is too narrow</text><rect x="16" y="58" width="10" height="10" rx="2" fill="#2f6f4f"/><text x="31" y="66" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Where the finishes actually fell</text><text x="360" y="66" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">dashed: what the range promises</text><line x1="66" y1="250" x2="864" y2="250" stroke="#e3e5e8" stroke-width="1"/><text x="58" y="254" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">60%</text><line x1="66" y1="211.5" x2="864" y2="211.5" stroke="#e3e5e8" stroke-width="1"/><text x="58" y="215.5" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">70%</text><line x1="66" y1="173" x2="864" y2="173" stroke="#e3e5e8" stroke-width="1"/><text x="58" y="177" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">80%</text><line x1="66" y1="134.5" x2="864" y2="134.5" stroke="#e3e5e8" stroke-width="1"/><text x="58" y="138.5" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">90%</text><line x1="66" y1="96" x2="864" y2="96" stroke="#e3e5e8" stroke-width="1"/><text x="58" y="100" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">100%</text><text x="248" y="294" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the 80% range</text><line x1="66" y1="173" x2="430" y2="173" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/><text x="111.5" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">No</text><line x1="111.5" y1="197.6" x2="111.5" y2="158.7" stroke="#1f2328" stroke-width="1"/><circle cx="111.5" cy="179.7" r="5.5" fill="#2f6f4f"/><text x="111.5" y="168.7" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">78%</text><text x="202.5" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">One</text><line x1="202.5" y1="214.3" x2="202.5" y2="177.1" stroke="#1f2328" stroke-width="1"/><circle cx="202.5" cy="195" r="5.5" fill="#2f6f4f"/><text x="202.5" y="184" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">74%</text><text x="293.5" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Two or three</text><line x1="293.5" y1="193.3" x2="293.5" y2="175" stroke="#1f2328" stroke-width="1"/><circle cx="293.5" cy="184.7" r="5.5" fill="#2f6f4f"/><text x="293.5" y="173.7" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">77%</text><text x="384.5" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Four or more</text><line x1="384.5" y1="195.4" x2="384.5" y2="174.2" stroke="#1f2328" stroke-width="1"/><circle cx="384.5" cy="185.1" r="5.5" fill="#2f6f4f"/><text x="384.5" y="174.1" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">77%</text><text x="667" y="294" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the 90% range</text><line x1="470" y1="134.5" x2="864" y2="134.5" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/><text x="519.2" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">No</text><line x1="519.2" y1="152.4" x2="519.2" y2="123.8" stroke="#1f2328" stroke-width="1"/><circle cx="519.2" cy="139" r="5.5" fill="#2f6f4f"/><text x="519.2" y="128" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">89%</text><text x="617.8" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">One</text><line x1="617.8" y1="153.9" x2="617.8" y2="134.8" stroke="#1f2328" stroke-width="1"/><circle cx="617.8" cy="144.1" r="5.5" fill="#2f6f4f"/><text x="617.8" y="133.1" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">88%</text><text x="716.2" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Two or three</text><line x1="716.2" y1="144.7" x2="716.2" y2="135.6" stroke="#1f2328" stroke-width="1"/><circle cx="716.2" cy="140.5" r="5.5" fill="#2f6f4f"/><text x="716.2" y="129.5" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">88%</text><text x="814.8" y="272" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Four or more</text><line x1="814.8" y1="149.2" x2="814.8" y2="136.3" stroke="#1f2328" stroke-width="1"/><circle cx="814.8" cy="143" r="5.5" fill="#2f6f4f"/><text x="814.8" y="132" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="600">88%</text><text x="16" y="324.4" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">Share of runners whose finish fell inside their own range, after calibration on the races before theirs.</text><text x="16" y="338" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">The line through each dot is its 95% interval, which resamples races rather than runners.</text></svg>
