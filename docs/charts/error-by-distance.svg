or in minutes, with the same error as a share of the runner&#x27;s own finish time beside it.</text><text x="16" y="400" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">Half of the misses are smaller than the average and a few are much larger: the table below has the middle and the ninth decile.</text></svg>
