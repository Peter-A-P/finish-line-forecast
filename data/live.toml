# The races this project publishes a prediction for, read by `finishline freeze`.
#
# The gun time is written by a person, with its zone, and confirmed with the race: the
# 24-hour rule is measured from it (publish/freeze.py). `freeze` refuses a race with no gun.
# Newfoundland is UTC-02:30 until the first Sunday of November and UTC-03:30 after, so
# Cape to Cabot is on daylight time and Run to Remember is not.

[c2c-2026]
name = "Cape to Cabot"
date = "2026-10-18"
distance_m = 20000
course_id = "cape-to-cabot-20000"
entrant_list = "c2c-2026"
gun = "2026-10-18T08:00:00-02:30"   # confirmed by Peter 2026-09-16
# One of the few races where visitors with no results here reach the top ten, so newcomers
# are drawn from how this course's past first-timers finished (placing/unseen.py).
newcomers = "course"

# The dress rehearsal: a real race, frozen and tagged before its gun and scored after, two
# weeks before Cape to Cabot. Its entrant list is on Trackie (`ingest.entrants.LISTS`).
[tt-2026]
name = "Turkey Tea 10k"
date = "2026-10-04"
distance_m = 10000
course_id = "turkey-tea-10000"
entrant_list = "tt-2026"
gun = "2026-10-04T08:00:00-02:30"   # confirmed by Peter 2026-09-19

# Field-forecast mode: the race publishes no start list, so `freeze` names its field from the
# participation model (models/participation.py, PLAN.md 5.6), reading the backtest that
# `finishline participation` writes to data/participation.json. One final file, no daily ones.
# Remembrance Day is after the clocks go back.
[r2r-2026]
name = "Run to Remember"
date = "2026-11-11"
distance_m = 11000
course_id = "run-to-remember-11000"
gun = "2026-11-11T08:00:00-03:30"   # confirmed by Peter 2026-09-19
