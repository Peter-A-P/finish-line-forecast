# The profiles supplied on 2026-09-25, and what they settled.
#
# All eleven courses in this file now carry an elevation profile built by project 11
# (Overload), supplied as chart images on 2026-09-25. Eight are from Peter Parker's own
# recording of the route; three, Turkey Tea, Run to Remember and Harbour Front, are drawn from
# Strava's own segment streams and have no clock in them at all. Seven are courses that had no
# elevation figure of any kind before, the Tely among them. The other four had one and it is
# kept beside the profile, which is the only way to see how far apart two readings of one road
# land: Turkey Tea and Flat Out agree to a metre or three, Cape to Cabot's profile comes in 8
# percent under the surveyed figure the race publishes, as barometric totals do, and Run to
# Remember disagrees outright, for the reason its entry gives.
# Each chart prints the climb and descent of its smoothed series, the start, finish, high and
# low heights, and the steepest and fastest windows, which is the grade distribution: the
# thing `metrics/grade.py` actually wants and that no published ascent total gives.
#
# ⚠️ **Only the road is taken.** Each chart also prints a distance, a moving time and an
# average pace, and one of them a heart rate. None of that is here, and no track, split or
# stream is. A watch file is training data about an identifiable person, which is the line
# this project drew for Strava, and the line does not move because the file arrived by a
# different route; an ascent total and a shape about a public road are a different thing.
# See docs/data-terms.md, which has the row.
#
# ⚠️ **One recording each, not a survey.** The charts resample by distance and smooth before
# totalling, and each prints the raw stream's own total beside it, 2 to 18 percent away. The
# recorded distance runs 0.1 to 1.2 percent over the certified one, as GPS does; `distance_m`
# stays the certified distance the results are scored at. Where a published figure exists it
# is kept as well, and only Cape to Cabot has one.
#
# ⚠️ **What they settled: the profiles side with `versus_peers`, not with the factor against
# Daniels' flat reference** (PLAN.md 13 item 43, and item 36 for why there are two figures).
# Nine courses in this file have both an elevation figure and another course of the same race
# length to compare against. On five of them the Minetti penalty the profile implies is inside
# the own-length interval and outside the flat-reference one; on two (Flat Out and the Five
# and Dime 10 km) the intervals are wide enough to hold it either way, so they separate
# nothing; on two, Mundy Pond and Harbour Front, it is outside both, by a tenth of a point and
# by nine tenths against their own length and by two and a half points against the flat
# reference. **Not one of the nine picks the flat reference.** The size of that disagreement
# tracks the race length and changes sign: from 5 to 10 km these courses measure 0.1 to 2.5
# points faster than their hills can account for, and from 11 km up 1.1 to 9.4 points slower,
# which is a population fading more over distance than Daniels' reference does and is not a
# hill anywhere. The two misses are the two rolling courses with no net drop, and their entries
# say so.

