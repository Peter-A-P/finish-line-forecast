# ⚠️ **What they settled: the profiles side with `versus_peers`, not with the factor against
# Daniels' flat reference** (PLAN.md 13 item 43, and item 36 for why there are two figures).
# Nine courses in this file have both an elevation figure and another course of the same race
# length to compare against. On five of them the Minetti penalty the profile implies is inside
# the own-length interval and outside the flat-reference one; on two (Flat Out and the Five
