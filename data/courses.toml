# The other four had one and it is kept beside the profile, which is the only way to see how
# far apart two readings of one road land: Turkey Tea and Flat Out agree to a metre or three,
# Cape to Cabot's profile comes in 7 percent under the surveyed figure the race publishes, as
# barometric totals do, and Run to Remember's differ by the smoothing scale, as its entry says.
#
# **The numbers here are the series', not the charts'.** Project 11 measured every course on
# one 20 m grid with one smoothing rule, where the charts had used a grid that grew with the
# course, so its totals differ from what the charts printed by a metre or two on the short
# courses and by 35 m on the marathon. The eight recordings' series are committed at
# data/profiles/<course_id>.json and a test holds `climb_m`, `drop_m` and the grade windows
# here to them. The three segment series are committed beside them: Peter decided on
# 2026-09-25 that a public Strava segment's profile may be stored and drawn, since it is a line
# along public roads and describes no person.
#
# Each series gives the climb and descent, the start, finish, high and low heights, and the
# steepest and fastest windows, which is the grade distribution: the thing `metrics/grade.py`
# actually wants and that no published ascent total gives. `steepest_grade` and
# `fastest_grade` below are those windows, each over a sixteenth of the course and at least
# 500 m.
#
# ⚠️ **Only the road is taken.** Each chart also prints a distance, a moving time and an
# average pace, and one of them a heart rate. None of that is here or in data/profiles/: the
# series carry heights on a distance grid and nothing else, no time, no pace, no heart rate
# and no coordinates, and a test refuses a profile file with any such field. A watch file is
# training data about an identifiable person, which is the line this project drew for Strava,
# and the line does not move because the file arrived by a different route; a height above
# sea level along a public road is a different thing. docs/data-terms.md has the rows.
#
# ⚠️ **One recording each, not a survey.** The series are resampled by distance and smoothed
# before totalling, and Strava's own total for each lands up to 15 percent either side. The
# recorded distance runs 0.1 to 1.2 percent over the certified one, as GPS does; `distance_m`
# stays the certified distance the results are scored at. Where a published figure exists it
# is kept as well, and only Cape to Cabot has one.
