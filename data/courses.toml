# Course profiles: elevation as published, with the source of every number.
#
# ⚠️ **These are priors, and the results outrank them.** The course factor this project
# uses is measured from finishes (see `finishline courses`). What is here exists so that a
# measured factor can be checked against the hills that are supposed to cause it, and so a
# course with no history has something to fall back on.
#
# Only courses with a figure anyone published are listed. A course with no entry here is
# not a gap in the model; it is a course whose factor is measured and needs no prior.
#
# `graded_fraction` is deliberately absent. Total climb does not determine the penalty
# without knowing how it is distributed, and nobody publishes that, so the grade is solved
# for from the measured factor and reported rather than assumed. See metrics/grade.py.

[cape-to-cabot-20000]
name = "Cape to Cabot"
distance_m = 20000
climb_m = 550
drop_m = 450
bearing_deg = 321
bearing_source = """\
Great-circle bearing from Cape Spear (47.5189 N, 52.6197 W) to Cabot Tower on Signal Hill \
(47.5707 N, 52.6815 W). North-west, so the westerly that pushes the Tely along is a \
headwind here: the same 30 km/h wind is +28.5 km/h of tailwind at the Tely and 18.5 km/h \
against on this course.\
"""
source = """\
capetocabot.com and the race's press coverage: "four major climbs, a 550-metre elevation \
gain and a 450-metre drop", with "grades of more than 10 per cent in some parts". The \
course page publishes an elevation profile image for the 2006 test run only; the certified \
course added a 1 km out-and-back on the flat of Southside Road, so the image understates \
the distance and not the climb. No GPX or KML is offered.\
"""
independent_climb_m = 519
independent_source = """\
Peter Parker's own watch on the 2025 edition. Six percent under the published figure, \
which is the usual disagreement between a barometric or GPS ascent total and a surveyed \
one, and it is kept because it brackets the number rather than replacing it.\
"""
notes = """\
Start at Cape Spear, finish at Cabot Tower on Signal Hill, so the course climbs about 100 m \
net. Named climbs: the height of land before Blackhead, the ridge before Freshwater Bay, \
the long climb to the top of the Southside Hills, Temperance Street, and the final pull to \
Cabot Tower.\
"""

[run-to-remember-11000]
name = "Run to Remember"
distance_m = 11000
climb_m = 56
drop_m = 56
source = """\
The course profile on the organisers' page, striderunningnl.ca/run-to-remember/ (Stride \
Running NL), as Peter read it on 2026-09-21: 56 m of elevation gain and 56 m of loss. The \
figures are on the profile chart; the page's text prints none. The chart runs from about \
165 m at the start down to about 114 m at the 5.5 km turnaround and back, so 51 m of the 56 \
is one steady grade and the rest is small undulation.\
"""
notes = """\
An out-and-back on the T'Railway, a gravel rail trail, which the page calls an "11km Trail \
Race". Start and finish at the T'Railway access at Burnaby Street, the Paradise end on the \
course map; turnaround on the T'Railway just before Commonwealth Avenue, Mount Pearl, at 5.5 \
km. No `bearing_deg`: an out-and-back has \
no net direction by construction.

⚠️ **The page says the start and turnaround were switched in 2025.** On an out-and-back that \
reverses the profile, downhill first and uphill to the finish instead of the other way round, \
and leaves the climb, the drop and the Minetti penalty unchanged; so the 2025 edition is \
pooled with the earlier ten. Which way the older editions ran is the page's word only.

⚠️ **The hills explain about a tenth of the measured factor, and the rest is not hills.** The \
course measures +1.64% [+1.17, +2.10] from 1,042 finishes. Through Minetti, 56 m up and 56 m \
down over 11 km cost +0.13% at the gentlest grade they allow (1.0%, which is about what the \
profile shows: 51 m over 5.5 km), +0.26% at 2% and +1.04% at 8%. To produce +1.64% they would \
need a 12.7% average grade on the graded sections (9.0% to 16.3% over the interval), and a \
rail bed does not have one. `finishline courses` will print that 12.7% because it is the \
arithmetic; read it as the size of what the hills are not. The likely rest: the gravel, and \
the race length, since this is the only 11 km course on the archive and so has no peers to \
cancel this population's fade against Daniels' reference (PLAN.md 13 item 36), which is worth \
about a point at Cape to Cabot's 20 km.\
"""

# ---------------------------------------------------------------------------------------
# Course bearing: the compass direction the runners travel, for the wind term.
#
# ⚠️ **Only point-to-point courses have one.** A loop or an out-and-back has no net
# direction, and the wind on it is a cost whichever way it blows, because you lose more
# running into it than you gain running back with it. A course with no `bearing_deg` here
# is treated that way deliberately; it is not a missing value to be filled in with zero.
#
# Bearings are great-circle, start point to finish point, from the published start and
# finish locations. They describe the net direction and not every turn: the Tely bends and
# Cape to Cabot does far more than bend. What they capture is which way the field is
# generally going, which is what decides whether a prevailing wind helps or hurts.

[tely-10-16093]
name = "Tely 10"
distance_m = 16093
bearing_deg = 70
source = """\
Great-circle bearing from the start in Paradise to the finish at Bannerman Park, \
St. John's. Peter's local knowledge, which the geometry then confirmed: the wind at this \
time of year is usually westerly, and a westerly is close to a straight tailwind on this \
bearing. A 30 km/h westerly projects to +28.5 km/h of tailwind here and to 18.5 km/h of \
headwind on Cape to Cabot, which is why one wind-speed number for the whole province was \
measuring nothing.\
"""

